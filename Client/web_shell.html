<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>$GODOT_PROJECT_NAME</title>
		<script>
			(function () {
				var coarse = window.matchMedia("(pointer: coarse)").matches;
				var side = Math.min(window.screen.width, window.screen.height);
				var phone = coarse && side <= 900;
				var framed = /(?:\?|&)frame=1(?:&|$)/.test(location.search);
				window.__godotPlay = phone || framed;
				if (!window.__godotPlay) {
					document.documentElement.classList.add("pc-frame");
				}
			})();
		</script>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

/* 竖版舞台：宽高比夹在设计分辨率 720/1560 和背景 1560/1560 之间。 */
#canvas {
	position: absolute !important;
	image-rendering: pixelated;
	image-rendering: crisp-edges;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

html.pc-frame,
html.pc-frame body {
	width: 100%;
	height: 100%;
	background: #0e1116;
	overflow: hidden;
}

html.pc-frame body {
	display: grid;
	place-items: center;
}

html.pc-frame #canvas,
html.pc-frame #status {
	display: none;
}

html.pc-frame iframe {
	border: 0;
	display: block;
	background: #000;
	width: min(720px, 100vw, calc(100vh * 720 / 1560));
	height: min(1560px, 100vh, calc(100vw * 1560 / 720));
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
if (!window.__godotPlay) {
	var frame = document.createElement("iframe");
	frame.title = "游戏";
	frame.src = location.pathname + "?frame=1";
	document.body.appendChild(frame);
} else {
	var godotScript = document.createElement("script");
	godotScript.src = "$GODOT_URL";
	godotScript.onload = function () {
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

const STAGE_MIN_ASPECT = 720 / 1560;
const STAGE_MAX_ASPECT = 1;

function fitPortraitStage() {
	const canvas = document.getElementById('canvas');
	const sw = window.innerWidth;
	const sh = window.innerHeight;
	let aspect = sw / Math.max(sh, 1);
	aspect = Math.min(STAGE_MAX_ASPECT, Math.max(STAGE_MIN_ASPECT, aspect));
	let cssW = sw;
	let cssH = sw / aspect;
	if (cssH > sh) {
		cssH = sh;
		cssW = sh * aspect;
	}
	cssW = Math.max(1, Math.floor(cssW));
	cssH = Math.max(1, Math.floor(cssH));
	const dpr = window.devicePixelRatio || 1;
	canvas.style.width = cssW + 'px';
	canvas.style.height = cssH + 'px';
	canvas.style.left = Math.floor((sw - cssW) / 2) + 'px';
	canvas.style.top = Math.floor((sh - cssH) / 2) + 'px';
	canvas.width = Math.max(1, Math.floor(cssW * dpr));
	canvas.height = Math.max(1, Math.floor(cssH * dpr));
}

fitPortraitStage();
window.addEventListener('resize', fitPortraitStage);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	let missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});
	if (!GODOT_THREADS_ENABLED) {
		missing = missing.filter(function (item) {
			return item.indexOf("Secure Context") !== 0;
		});
	}

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
	};
	document.body.appendChild(godotScript);
}
		</script>
	</body>
</html>
