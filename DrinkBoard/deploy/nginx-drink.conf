# DrinkBoard。放进已经在服务 /var/www/fvxpcue 的那个 server { } 里：
#   include /etc/nginx/snippets/drinkboard.conf;
# 公网只开 80。8773 只给本机 Nginx 反代，不要对公网放行。

location = /drink {
    return 301 /drink/;
}

location = /drink/index.html {
    root /var/www/fvxpcue;
    add_header Cache-Control "no-cache";
}

location /drink/api/ {
    proxy_pass http://127.0.0.1:8773/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    client_max_body_size 32k;
    proxy_read_timeout 30s;
}

location /drink/ {
    root /var/www/fvxpcue;
    index index.html;
    try_files $uri $uri/ /drink/index.html;
}
